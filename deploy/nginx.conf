# Reverse proxy for the knowledge base: TLS termination, WebSocket upgrade, upload limits, security headers.
# Install as /etc/nginx/conf.d/kb.conf (nginx >= 1.25). Replace kb.example.corp and certificate paths.
# Test: nginx -t && systemctl reload nginx

upstream kb_app {
    # One or more application instances. WebSocket sessions are stateless across instances
    # (documents are coordinated through PostgreSQL), so plain round-robin / least_conn works.
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    # server 10.0.0.12:8080 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# Collaborative editing with several instances: every request of one page (WebSocket, HTTP-fallback tunnel open,
# send, poll) goes to the same instance, chosen by a consistent hash of the page id. Content is correct on any
# instance (journal in PostgreSQL + NOTIFY), but presence/cursors are kept per instance and an HTTP-fallback tunnel
# lives in the memory of the instance that opened it (docs/OPERATIONS.md §4, tests/resilience/multi-instance.test.ts).
# If an instance fails, nginx moves its pages to the next one (consistent hashing: other pages stay where they are).
map $uri $kb_collab_key {
    ~^/api/v1/collab/(?<kb_page>[0-9a-fA-F-]{36})  $kb_page;
    default                                        $uri;
}
upstream kb_collab {
    hash $kb_collab_key consistent;
    server 127.0.0.1:8080 max_fails=1 fail_timeout=10s;
    # server 10.0.0.12:8080 max_fails=1 fail_timeout=10s;   (same list as kb_app)
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Do not expose /metrics publicly (scrape the instances directly or restrict by address).
geo $kb_metrics_allowed {
    default        0;
    127.0.0.1/32   1;
    10.0.0.0/8     1;
}

server {
    listen 80;
    listen [::]:80;
    server_name kb.example.corp;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name kb.example.corp;

    ssl_certificate     /etc/ssl/kb/fullchain.pem;
    ssl_certificate_key /etc/ssl/kb/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:kb_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security headers. The application also sets a CSP (helmet) and per-file CSP/nosniff on attachments.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    server_tokens off;

    # Uploads: keep >= MAX_UPLOAD_MB / MAX_IMPORT_MB of the application. Bodies are streamed to the app
    # (no buffering on the proxy disk) so large files and resumable chunks do not fill /var/lib/nginx.
    client_max_body_size 1100m;
    client_body_timeout 300s;
    proxy_request_buffering off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id $request_id;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 300s;

    # Real-time channels: collaborative editing (page affinity, see upstream kb_collab) and server events (WebSocket).
    location ~ ^/api/v1/collab/ {
        proxy_pass http://kb_collab;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }
    location ~ ^/api/v1/events(/|$) {
        proxy_pass http://kb_app;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # The client pings every 25 s; keep idle sockets well above that.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Downloads / exports: stream, allow long transfers, support Range.
    location ~ ^/api/v1/(attachments|exports|archives)/ {
        proxy_pass http://kb_app;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location = /metrics {
        if ($kb_metrics_allowed = 0) { return 404; }
        proxy_pass http://kb_app;
    }

    location / {
        proxy_pass http://kb_app;
    }

    # Hashed static assets are immutable.
    location /assets/ {
        proxy_pass http://kb_app;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    access_log /var/log/nginx/kb.access.log combined;
    error_log  /var/log/nginx/kb.error.log warn;
}
