# Реестр требований — сгенерирован из SPECIFICATION.md (v3.0, 22.10.2026)
# Поля: id, source, module, priority (P0/P1/P2), kind, title, acceptance, detail (опц.: полная формулировка, если title сокращён до 140 симв.), overridden_by (опц.)

- id: R-PROCESS-001
  source: "§A п.1"
  module: PROCESS
  priority: P1
  kind: process
  title: "Перед изменениями исследовать репозиторий: структуру, стек, зависимости, миграции, API, UI, тесты, конфигурации, дефекты"
  acceptance: "Есть отчёт аудита репозитория до первых изменений"
- id: R-PROCESS-002
  source: "§A п.1"
  module: PROCESS
  priority: P1
  kind: constraint
  title: "Не переписывать исправно работающий код без причины; при пустом репозитории создать поддерживаемую структуру"
  acceptance: "Каждое переписывание обосновано в DECISIONS.md"
- id: R-PROCESS-003
  source: "§A п.2"
  module: PROCESS
  priority: P0
  kind: process
  title: "Составить реестр требований: ID, модуль, приоритет P0/P1/P2, статус, тесты, критерий приёмки; сохранить docs/REQUIREMENTS_TRACEABILITY.md"
  acceptance: "Каждый пункт ТЗ имеет запись в реестре; ни один пункт не потерян"
- id: R-PROCESS-004
  source: "§A п.3"
  module: PROCESS
  priority: P1
  kind: process
  title: "Создать docs/ARCHITECTURE.md, DECISIONS.md, TEST_MATRIX.md, OPERATIONS.md, RELEASE_READINESS.md"
  acceptance: "Все пять документов существуют и актуальны"
- id: R-PROCESS-005
  source: "§A п.3"
  module: PROCESS
  priority: P1
  kind: process
  title: "Технические решения принимать самостоятельно с объяснением компромиссов; уточнения только при блокирующей неоднозначности …"
  acceptance: "Решения задокументированы в DECISIONS.md"
  detail: "Технические решения принимать самостоятельно с объяснением компромиссов; уточнения только при блокирующей неоднозначности, критическом риске или нужде в секретах"
- id: R-PROCESS-006
  source: "§A п.4"
  module: PROCESS
  priority: P1
  kind: process
  title: "Работать вертикальными срезами: БД + сервер + API + интерфейс + права + тесты + диагностика"
  acceptance: "Каждый срез содержит хранение, API, UX, права и тесты"
- id: R-PROCESS-007
  source: "§A п.5"
  module: PROCESS
  priority: P0
  kind: process
  title: "После каждого среза запускать сборку, статический анализ, модульные, интеграционные, E2E и визуальную проверку …"
  acceptance: "Логи CI по каждому срезу зелёные перед следующим"
  detail: "После каждого среза запускать сборку, статический анализ, модульные, интеграционные, E2E и визуальную проверку; исправлять ошибки до следующего среза"
- id: R-QA-001
  source: "§A п.6"
  module: QA
  priority: P0
  kind: process
  title: "Тестировать в реальном браузере: навигация, курсор, выделение, hover, меню, drag-and-drop, масштаб, таблицы, мобильная версия …"
  acceptance: "Браузерные E2E покрывают все перечисленные области"
  detail: "Тестировать в реальном браузере: навигация, курсор, выделение, hover, меню, drag-and-drop, масштаб, таблицы, мобильная версия, copy/paste, Undo/Redo, импорт/экспорт, права, восстановление"
- id: R-PROCESS-008
  source: "§A п.7"
  module: PROCESS
  priority: P0
  kind: constraint
  title: "Не скрывать ограничения: непроведённые испытания указывать как непроверенные блокеры; не заявлять production-ready без свидетельств"
  acceptance: "Отчёт перечисляет непроверенные блокеры"
- id: R-PROCESS-009
  source: "§A п.8"
  module: PROCESS
  priority: P0
  kind: constraint
  title: "Не удалять функции для упрощения; при нехватке библиотеки расширить/заменить её с тестами"
  acceptance: "Нет удалённых функций без замены"
- id: R-OPS-001
  source: "§A п.9"
  module: OPS
  priority: P0
  kind: constraint
  title: "Сохранять исходные данные и обратную совместимость; любая миграция с резервной копией, проверкой и откатом"
  acceptance: "Каждая миграция имеет backup, проверку и протестированный откат"
- id: R-PROCESS-010
  source: "§A п.10"
  module: PROCESS
  priority: P1
  kind: process
  title: "Итоговый отчёт: реализованное, трассировка, команды запуска, тесты, дефекты, производительность, резервирование, ограничения …"
  acceptance: "Отчёт содержит все перечисленные разделы"
  detail: "Итоговый отчёт: реализованное, трассировка, команды запуска, тесты, дефекты, производительность, резервирование, ограничения, инструкция эксплуатации"
- id: R-PROCESS-011
  source: "§B"
  module: PROCESS
  priority: P0
  kind: constraint
  title: "Разделы A–L имеют приоритет над устаревшими формулировками исторического корпуса"
  acceptance: "Коллизии в реестре разрешены в пользу A–L"
- id: R-EXPORT-001
  source: "§B"
  module: EXPORT
  priority: P0
  kind: functional
  title: "Обязательны DOCX и Markdown import/export, CSV/XLSX для таблиц, PDF и HTML как экспорт, ZIP полного переносимого архива"
  acceptance: "Экспорт PDF/HTML/DOCX/MD/ZIP и импорт DOCX/MD/CSV/XLSX проходят тесты"
- id: R-IMPORT-001
  source: "§B"
  module: IMPORT
  priority: P2
  kind: constraint
  title: "PDF как редактируемый импорт не обязателен; раннее исключение PDF/HTML из экспорта отменено"
  acceptance: "PDF-импорт не требуется в приёмке"
- id: R-TREE-001
  source: "§B"
  module: TREE
  priority: P1
  kind: constraint
  title: "Глубина вложенности произвольная; ранний API-лимит 15 уровней не становится UX-ограничением; техлимит только если доказан"
  acceptance: "Создание и перенос глубоких структур (>15) работает или лимит обоснован"
- id: R-ACL-001
  source: "§B"
  module: ACL
  priority: P0
  kind: constraint
  title: "Пространства и группы — первичный уровень доступа; постраничные ACL — редкие явные исключения"
  acceptance: "Модель прав основана на пространствах/группах"
- id: R-ACL-002
  source: "§B"
  module: ACL
  priority: P0
  kind: constraint
  title: "Никогда не заставлять пользователя выбирать права при обычном создании статьи"
  acceptance: "Создание статьи без диалога прав"
- id: R-COLLAB-001
  source: "§B"
  module: COLLAB
  priority: P0
  kind: constraint
  title: "Синхронизация не обязана быть исключительно WebSocket; критерий — без потерь, многопользовательское редактирование и восстановление …"
  acceptance: "Тесты обрывов и конкурентной правки без потерь"
  detail: "Синхронизация не обязана быть исключительно WebSocket; критерий — без потерь, многопользовательское редактирование и восстановление после обрывов; CRDT/OT по проверенным свойствам"
- id: R-UI-001
  source: "§B"
  module: UI
  priority: P1
  kind: constraint
  title: "UI светлый, минималистичный, сдержанный, по согласованным макетам; не тёмный фирменный UI"
  acceptance: "Визуальная проверка эталонных экранов"
- id: R-HISTORY-001
  source: "§B"
  module: HISTORY
  priority: P0
  kind: constraint
  title: "История и резервирование сохраняют максимальные из согласованных гарантий, без упрощения ради скорости"
  acceptance: "Применены наибольшие сроки/гарантии из всех версий"
- id: R-QA-002
  source: "§B"
  module: QA
  priority: P0
  kind: constraint
  title: "«Всё протестировано» = доказанное покрытие каждого доступного элемента и действия через каталог состояний, матрицы переходов, pairwise …"
  acceptance: "TEST_MATRIX покрывает каждый элемент и действие"
  detail: "«Всё протестировано» = доказанное покрытие каждого доступного элемента и действия через каталог состояний, матрицы переходов, pairwise, property-based и комбинаторные тесты"
- id: R-UI-002
  source: "§C"
  module: UI
  priority: P1
  kind: constraint
  title: "Внешне простой, эстетичный, быстрый, интуитивный инструмент уровня Notion; внутри — транзакционная, восстановимая, наблюдаемая платформа"
  acceptance: "UX-сравнение с Notion без существенного проигрыша"
- id: R-UI-003
  source: "§C"
  module: UI
  priority: P1
  kind: functional
  title: "Минимизировать обязательные диалоги и клики; умные контекстные действия, наследование настроек и понятные значения по умолчанию"
  acceptance: "Ключевые задачи без обязательных диалогов"
- id: R-TREE-002
  source: "§C"
  module: TREE
  priority: P1
  kind: functional
  title: "«+» рядом с разделом создаёт дочернюю страницу с фокусом в заголовке"
  acceptance: "E2E: клик «+» → дочерняя страница, фокус в заголовке"
- id: R-TABLE-001
  source: "§C"
  module: TABLE
  priority: P1
  kind: functional
  title: "Таблица сама переносит текст"
  acceptance: "Длинный текст в ячейке переносится без обрезки"
- id: R-UI-004
  source: "§C"
  module: UI
  priority: P1
  kind: functional
  title: "Меню остаётся в пределах экрана"
  acceptance: "Меню у краёв viewport не обрезается"
- id: R-UI-005
  source: "§C"
  module: UI
  priority: P1
  kind: functional
  title: "Последний контекст навигации восстанавливается"
  acceptance: "После перезапуска открывается последний контекст"
- id: R-EDITOR-001
  source: "§C"
  module: EDITOR
  priority: P0
  kind: functional
  title: "Сохранять выделение, курсор, прокрутку, состояние дерева, открытые вкладки и данные при ререндере, навигации, синхронизации и сбоях сети"
  acceptance: "E2E: после sync/ререндера курсор и выделение на месте"
- id: R-HISTORY-002
  source: "§C"
  module: HISTORY
  priority: P0
  kind: functional
  title: "Все операции обратимы где возможно; опасные действия — точный предпросмотр последствий без бесконечных подтверждений"
  acceptance: "Каждая опасная операция имеет предпросмотр и отмену"
- id: R-A11Y-001
  source: "§C"
  module: A11Y
  priority: P1
  kind: functional
  title: "Действия мышью, клавиатурой и на телефоне одинаково доступны"
  acceptance: "Матрица ввода мышь/клавиатура/сенсор пройдена"
- id: R-UI-006
  source: "§C"
  module: UI
  priority: P0
  kind: constraint
  title: "Нет обрезаний, перекрытий, случайного скролла, прыжков layout, дрожания, ложных «сохранено» и скрытой утраты данных"
  acceptance: "Визуальные регрессии и CLS-проверки без нарушений"
- id: ROUTE-01
  source: "§D"
  module: AUTH
  priority: P0
  kind: scenario
  title: "Сотрудник: вход → свои пространства → регламент → поиск → статья в отделе одной кнопкой → форматирование → вставка Excel/изображения …"
  acceptance: "E2E-маршрут сотрудника проходит полностью без потерь"
  detail: "Сотрудник: вход → свои пространства → регламент → поиск → статья в отделе одной кнопкой → форматирование → вставка Excel/изображения → ссылка в пределах прав → выход и возврат без потерь"
- id: ROUTE-02
  source: "§D"
  module: OFFLINE
  priority: P0
  kind: scenario
  title: "Автор: личный черновик → офлайн → синхронизация → перенос в отдел с предпросмотром видимости → согласование → публикация → обновление и …"
  acceptance: "E2E-маршрут автора проходит полностью"
  detail: "Автор: личный черновик → офлайн → синхронизация → перенос в отдел с предпросмотром видимости → согласование → публикация → обновление и откат версии"
- id: ROUTE-03
  source: "§D"
  module: SPACE
  priority: P0
  kind: scenario
  title: "Руководитель пространства: дерево drag-and-drop → шаблоны → участники и доступ группы → контроль публикаций → восстановление удалённой ветки"
  acceptance: "E2E-маршрут руководителя проходит полностью"
- id: ROUTE-04
  source: "§D"
  module: ADMIN
  priority: P0
  kind: scenario
  title: "Администратор: подразделение/группа → сотрудник → автодоступ к пространству → гость в раздел на срок → приостановка → отзыв сессий …"
  acceptance: "E2E-маршрут администратора проходит полностью"
  detail: "Администратор: подразделение/группа → сотрудник → автодоступ к пространству → гость в раздел на срок → приостановка → отзыв сессий → объяснение прав → аудит и бэкапы → восстановление тестового экземпляра"
- id: ROUTE-05
  source: "§D"
  module: COLLAB
  priority: P0
  kind: scenario
  title: "Два редактора правят абзац, таблицу и структуру; связь у одного пропадает и восстанавливается; подтверждённый текст не теряется …"
  acceptance: "E2E: нулевая потеря подтверждённого текста, связная история"
  detail: "Два редактора правят абзац, таблицу и структуру; связь у одного пропадает и восстанавливается; подтверждённый текст не теряется, история связна"
- id: ROUTE-06
  source: "§D"
  module: AUDIT
  priority: P0
  kind: scenario
  title: "Аудитор проверяет кто и когда изменил документ, права, удаление, импорт, восстановление без скрытого доступа к посторонним материалам"
  acceptance: "Аудитор видит журнал, но не содержимое без прав"
- id: E-01
  source: "§E"
  module: COLLAB
  priority: P0
  kind: constraint
  title: "Подтверждённые сервером изменения не теряются при обычных отказах приложения"
  acceptance: "Fault-injection: 0 потерь подтверждённых операций"
- id: E-02
  source: "§E"
  module: OFFLINE
  priority: P0
  kind: constraint
  title: "Локальные неподтверждённые изменения в устойчивой очереди, статус виден пользователю"
  acceptance: "Перезапуск вкладки офлайн сохраняет очередь, статус отображается"
- id: E-03
  source: "§E"
  module: COLLAB
  priority: P0
  kind: constraint
  title: "Повторная/переупорядоченная доставка операций не дублирует и не стирает данные"
  acceptance: "Тест дублей/перестановки операций без изменений результата"
- id: E-04
  source: "§E"
  module: COLLAB
  priority: P0
  kind: constraint
  title: "Одновременные изменения не перезаписываются молча; конфликт сохраняет данные и объясним"
  acceptance: "Конфликтный тест сохраняет обе версии с объяснением"
- id: E-05
  source: "§E"
  module: TREE
  priority: P0
  kind: constraint
  title: "Перенос, удаление, восстановление дерева и изменение ACL атомарны или имеют гарантированную компенсацию"
  acceptance: "Сбой посреди операции не оставляет частичного состояния"
- id: E-06
  source: "§E"
  module: PAGE
  priority: P0
  kind: constraint
  title: "Внутренние ссылки используют стабильные ID и переживают переименование и перенос"
  acceptance: "Ссылки работают после rename/move"
- id: E-07
  source: "§E"
  module: ARCHIVE
  priority: P0
  kind: constraint
  title: "Удаление обратимо через корзину и версии в пределах политики хранения"
  acceptance: "Восстановление из корзины в пределах срока хранения"
- id: E-08
  source: "§E"
  module: BACKUP
  priority: P0
  kind: constraint
  title: "Бэкап подтверждён только успешным восстановлением и проверкой контрольных сумм"
  acceptance: "Каждый бэкап имеет протокол restore + checksum"
- id: E-09
  source: "§E"
  module: IMPORT
  priority: P0
  kind: constraint
  title: "Импорт не повреждает существующие материалы, поддерживает dry-run и безопасный повтор"
  acceptance: "Повтор импорта идемпотентен, dry-run без изменений"
- id: E-10
  source: "§E"
  module: EXPORT
  priority: P0
  kind: constraint
  title: "Полный архив пригоден для чтения без приложения и обратного импорта"
  acceptance: "Архив читается без приложения и импортируется обратно"
- id: E-11
  source: "§E"
  module: ACL
  priority: P0
  kind: constraint
  title: "Права одинаково применяются к документу, поиску, вложению, истории, экспорту, API, уведомлениям и кешу"
  acceptance: "Матрица ACL по всем каналам без утечек"
- id: E-12
  source: "§E"
  module: ACL
  priority: P0
  kind: constraint
  title: "При отзыве прав не остаётся работающих прямых ссылок/сессий, раскрывающих запрещённые данные"
  acceptance: "После отзыва все каналы возвращают 403/404"
- id: E-13
  source: "§E"
  module: COLLAB
  priority: P0
  kind: constraint
  title: "UI не утверждает «сохранено» без устойчивой фиксации"
  acceptance: "Статус «сохранено» только после подтверждения сервера"
- id: E-14
  source: "§E"
  module: OPS
  priority: P0
  kind: constraint
  title: "Обновления приложения и миграции имеют воспроизводимый откат"
  acceptance: "Тест отката миграции и релиза"
- id: R-QA-003
  source: "§F"
  module: QA
  priority: P1
  kind: process
  title: "Для каждого компонента перечислить состояния: default, hover, focus, active, disabled, loading, error, empty, overflow, mobile …"
  acceptance: "Каталог состояний в TEST_MATRIX для каждого компонента"
  detail: "Для каждого компонента перечислить состояния: default, hover, focus, active, disabled, loading, error, empty, overflow, mobile, zoom 200%, keyboard, screen-reader"
- id: R-QA-004
  source: "§F"
  module: QA
  priority: P0
  kind: process
  title: "Для каждого действия проверить нормальный путь, отмену, повтор, двойной клик, медленную сеть, офлайн, конфликт, недостаток прав …"
  acceptance: "Матрица действий × условий заполнена"
  detail: "Для каждого действия проверить нормальный путь, отмену, повтор, двойной клик, медленную сеть, офлайн, конфликт, недостаток прав, ошибку сервера, восстановление, обратную операцию"
- id: R-UI-007
  source: "§F"
  module: UI
  priority: P1
  kind: functional
  title: "Кнопки/иконки: семантика, tooltip, hit target, доступность, реакция, идемпотентность"
