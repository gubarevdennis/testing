  page: 'команда «Страница и совместная работа»'
  editor: 'команда «Редактор»'
  shell: 'команда «Навигация и оболочка»'
  home: 'команда «Навигация и оболочка»'
  search: 'команда «Поиск»'
  import: 'команда «Импорт и экспорт»'
  templates: 'команда «Редактор»'
  trash: 'команда «Навигация и оболочка»'
  settings: 'команда «Навигация и оболочка»'
  auth: 'команда «Администрирование и доступ»'
  help: 'команда «Навигация и оболочка»'
  app: 'команда «Навигация и оболочка»'
  ui: 'команда «Навигация и оболочка»'
  common: 'команда «Навигация и оболочка»'
  runtime: 'команда «Навигация и оболочка»'

# Overrides of the critical flag computed by scripts/qa/inventory.ts (destructive / data / ACL / auth / recovery).
critical:
  add: []
  remove: []

# Routes the runtime crawl (tests/e2e/qa-crawl.spec.ts) opens from a data table the static matcher cannot read.
mappings:
  - action: app/Authenticated/route.p-pageid-slug
    tests:
      - test: 'tests/e2e/qa-crawl.spec.ts › QA26-01, QA26-04, R-UI-026: every route rendered as owner exposes only named controls; runtime inventory recorded'
    note: the crawl opens the route by its address and records every control on it
  - action: admin/AdminPage/route.admin-settings
    tests:
      - test: 'tests/e2e/qa-crawl.spec.ts › QA26-01, QA26-04, R-UI-026: every route rendered as owner exposes only named controls; runtime inventory recorded'
    note: the crawl opens the route by its address and records every control on it
