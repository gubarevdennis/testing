<!--StartFragment--><p class="MsoNormal">Коллеги, добрый день!<o:p></o:p></p>
<p class="MsoNormal"><o:p>&nbsp;</o:p></p>
<p class="MsoNormal">С понедельника меняется <b>график отгрузки</b>. Подробности — в <a href="https://portal.example.ru/news/42?utm_campaign=mail&amp;utm_source=outlook&amp;mc_cid=abc123&amp;id=42">новости на портале</a>.<o:p></o:p></p>
<ul style="margin-top:0cm" type="disc"><li class="MsoListParagraph" style="margin-left:0cm;mso-list:l0 level1 lfo1">Отгрузка до 18:00<o:p></o:p></li><li class="MsoListParagraph" style="margin-left:0cm;mso-list:l0 level1 lfo1">Самовывоз — по записи<o:p></o:p></li></ul>

<div style="border:none;border-left:solid #0563C1 1.5pt;padding:0cm 0cm 0cm 4.0pt"><blockquote style="margin-left:0cm"><p class="MsoNormal">Исходное письмо: просим подтвердить окна отгрузки.<o:p></o:p></p></blockquote></div>
